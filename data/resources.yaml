last_reviewed: "2026-10-04"

categories:
  - slug: ai-assisted-analysis-and-sql
    title: AI-Assisted Analysis and SQL
    page: resources/ai-assisted-analysis-and-sql.md
    summary: Use AI to explore datasets, write and inspect SQL, and move from a question to a reproducible analysis.
    try_this: Give an assistant a small dataset and one metric definition. Ask for an analysis plan first, then we can verify every query, number, and chart.
  - slug: data-preparation-and-extraction
    title: AI for Data Preparation and Extraction
    page: resources/data-preparation-and-extraction.md
    summary: Turn documents and messy inputs into structured, validated data that can enter an analysis workflow.
    try_this: Extract one messy document into a typed schema. We can validate the result and learn from the rows that failed.
  - slug: ai-assisted-machine-learning
    title: AI-Assisted Machine Learning
    page: resources/ai-assisted-machine-learning.md
    summary: Build strong baselines, compare models, and automate repetitive parts of supervised machine learning.
    try_this: Run one AutoML baseline beside our current model and compare accuracy, runtime, leakage risk, and interpretability.
  - slug: tabular-foundation-models
    title: Tabular Foundation Models
    page: resources/tabular-foundation-models.md
    summary: Try pretrained models designed for tabular prediction and compare them with established tree-based baselines.
    try_this: Use a tabular foundation model as the first baseline for one small dataset, then compare the result with CatBoost or XGBoost.
  - slug: coding-agents-and-context
    title: Coding Agents and Context Engineering
    page: resources/coding-agents-and-context.md
    summary: Use coding agents safely in notebooks and repositories, with durable project instructions and business context.
    try_this: Add an AGENTS.md file and a prediction-contract.md file to one ML project, then ask an agent to refactor one repeated notebook step.
  - slug: data-science-agents
    title: Data Science Agents
    page: resources/data-science-agents.md
    summary: Build agents that plan analyses, call tools, inspect data, and complete multi-step data tasks.
    try_this: Ask an agent to produce an analysis plan before it writes code. We can also require it to record assumptions and unresolved questions.
  - slug: evaluation-and-reproducibility
    title: Evaluation and Reproducibility
    page: resources/evaluation-and-reproducibility.md
    summary: Test AI-generated analysis and agent behavior with datasets, traces, assertions, and repeatable evaluations.
    try_this: Save ten representative analysis questions with expected properties, then rerun them whenever we change the prompt, model, or tools.
  - slug: mlops-and-production
    title: MLOps and Production
    page: resources/mlops-and-production.md
    summary: Move AI-assisted data work from a notebook into tested, observable, deployable systems.
    try_this: Turn one notebook into a package with one command to run it, several tests, a container, and a small deployment target.
  - slug: visualization-and-communication
    title: Visualization and Communication
    page: resources/visualization-and-communication.md
    summary: Use AI to prototype visual explanations, analytical apps, dashboards, and reports without giving up review.
    try_this: Generate two visual explanations of the same result for different audiences, then check whether both charts preserve the same claim.
  - slug: time-series-foundation-models
    title: Time Series Foundation Models
    page: resources/time-series-foundation-models.md
    summary: Apply pretrained forecasting models and compare zero-shot forecasts with domain-specific baselines.
    try_this: Run a zero-shot forecast on one business series and compare the result with a seasonal naive baseline using rolling backtests.
  - slug: end-to-end-courses
    title: End-to-End Courses
    page: resources/end-to-end-courses.md
    summary: Follow structured courses with code, exercises, and projects that connect several parts of the workflow.
    try_this: Choose one course and finish a small project from it before we start another course.

